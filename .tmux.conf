# set -g default-terminal "xterm-256color"

# make colors inside tmux look the same as outside of tmux
# see https://github.com/tmux/tmux/issues/696
# see https://stackoverflow.com/a/41786092
# set-option -ga terminal-overrides ",xterm-256color:Tc"
# enable styled underscore like undercurl in neovim diagnostics
# set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# underscore colours - needs tmux-3.0                                                                                               
# set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Eanble autoread in neovim
set-option -g focus-events on

# bind Home and End to send Escape
bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"

set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style=

# Enables support for showing images in kitty terminal and nvimj
set -gq allow-passthrough on 
set -g visual-activity off


# bind prefix shortcut to CTRL-a
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# bind vertical split to |
unbind %
bind | split-window -h

# bind horizontal split to -
unbind '"'
bind - split-window -v

# reload conf unsing rc
unbind r
bind r source-file ~/.tmux.conf

# resize panes
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# maximize pane
bind -r m resize-pane -Z

# skip kill-pane confirm
bind-key x kill-pane

# gracefully kill the current session (Ctrl+C to running processes first)
bind-key X run-shell -b '~/.tmux/scripts/tmux-session-terminator #{session_name}'

# copy mode like vim
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y" (now this is overriden by tmux-yank plugin)

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

# open workspace navigator
unbind f
bind-key f display-popup -T"   Workspace Navigator " -w 75% -h 40% -E "~/.tmux/scripts/list-projects"

# open lazygit
bind-key g new-window -n 'lazygit' lazygit

# open spotify_player
bind-key S if-shell "tmux has-session -t spotify_player 2>/dev/null" \
  "switch-client -t spotify_player" \
  "new-session -s 'spotify_player' spotify_player" \

# open notes (obsidian)
bind-key N if-shell "tmux has-session -t notes 2>/dev/null" \
  "switch-client -t notes" \
  "new-session -s notes -c ~/notes/ '/opt/nvim-linux-x86_64/bin/nvim .'"

# open lazydocker
# bind-key y new-window -n 'lazydocker' lazydocker

# enable mouse
set -g mouse on

# plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Plugins

# navigation
set -g @plugin 'christoomey/vim-tmux-navigator' # navigate panes using Ctrl-hjkl

# utilities
set -g @plugin 'tmux-plugins/tmux-yank' # copy to system clipboard
set -g @plugin 'tmux-plugins/tmux-open' # open highligheted selection (o: xdg-open, C-o: $EDITOR, S-s: search on web)
# In my case C-o opens nvim using the selection as a file name, and S-s search using Google

set -g @plugin 'MunifTanjim/tmux-mode-indicator' # show tmux mode in status bar

# theme config (catppuccin/tmux >= v2)
# The theme is loaded explicitly with `run` before status-left/right are set,
# so that its colors and status modules are defined when we reference them.
# The @plugin line only lets TPM install/update it.
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha' # or latte, frappe, macchiato

# window status: "<text> █<number>" with the number on the right
set -g @catppuccin_window_status_style "custom" # required to use custom separators
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_left_separator "#[fg=#{@catppuccin_window_text_color},bg=default]"
set -g @catppuccin_window_current_left_separator "#[fg=#{@catppuccin_window_current_text_color},bg=default]"
set -g @catppuccin_window_middle_separator "#[fg=#{@catppuccin_window_number_color},bg=#{@catppuccin_window_text_color}]"
set -g @catppuccin_window_current_middle_separator "#[fg=#{@catppuccin_window_current_number_color},bg=#{@catppuccin_window_current_text_color}]"
set -g @catppuccin_window_right_separator "#[fg=#{@catppuccin_window_number_color},bg=default]"
set -g @catppuccin_window_current_right_separator "#[fg=#{@catppuccin_window_current_number_color},bg=default]"

set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_flags_icon_last " 󰖰"
set -g @catppuccin_window_flags_icon_current " 󰖯"
set -g @catppuccin_window_flags_icon_zoom " 󰁌"
set -g @catppuccin_window_flags_icon_mark " 󰃀"
set -g @catppuccin_window_flags_icon_silent " 󰂛"
set -g @catppuccin_window_flags_icon_activity " 󱅫"
set -g @catppuccin_window_flags_icon_bell " 󰂞"

# status line modules
set -g @catppuccin_status_background "none" # transparent bar (same as "default" in v0.x)
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text " #(~/.tmux/scripts/shorten_path #{pane_current_path} 40)"

run '~/.tmux/plugins/tmux/catppuccin.tmux'

set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_user}#{E:@catppuccin_status_host}#{E:@catppuccin_status_session}"

# Initialize TMUX Plugin Manager (keep at very bottom)
run '~/.tmux/plugins/tpm/tpm'


